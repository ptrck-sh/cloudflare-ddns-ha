name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.2"
    validations:
      required: true
  - type: dropdown
    id: families
    attributes:
      label: Tracked record types
      options:
        - A
        - AAAA
        - A and AAAA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Lines from the Home Assistant log mentioning cloudflare_ddns.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings → Devices & Services → Cloudflare DDNS → three-dot menu →
        Download diagnostics. The token, the zone ID and IP addresses are
        already redacted.
      render: json
