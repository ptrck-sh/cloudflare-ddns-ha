stages:
  - lint
  - test
  - release

include:
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/base@0.23.0
    inputs:
      runner_tags:
        - homelab
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/pre-commit@0.23.0
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/security@0.23.0
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/alint-fix@0.23.0

pytest:
  stage: test
  image: ghcr.io/astral-sh/uv:0.11.14-python3.14-trixie-slim
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
    UV_LINK_MODE: copy
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv
  script:
    - uv sync --locked
    - uv run pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

github-release:
  stage: release
  image: alpine:3.24
  rules:
    - if: $CI_COMMIT_TAG =~ /-rc\.[0-9]+$/
      when: delayed
      start_in: 2 minutes
      variables:
        PRERELEASE: --prerelease
    - if: $CI_COMMIT_TAG
      when: delayed
      start_in: 2 minutes
  before_script:
    - apk add --no-cache github-cli jq
  script:
    - test "$(jq -r .version custom_components/cloudflare_ddns/manifest.json)" = "$CI_COMMIT_TAG"
    - gh release create "$CI_COMMIT_TAG" --repo ptrck-sh/cloudflare-ddns-ha --verify-tag --generate-notes $PRERELEASE
  retry: 2
