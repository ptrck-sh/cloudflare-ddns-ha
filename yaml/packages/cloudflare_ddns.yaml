rest:
  - resource: https://api.ipify.org?format=json
    scan_interval: 300
    sensor:
      - name: "Public IP"
        unique_id: public_ip_ipify
        value_template: "{{ value_json.ip }}"
        icon: mdi:ip-network

rest_command:
  cloudflare_get_dns_record:
    url: "https://api.cloudflare.com/client/v4/zones/{{ zone_id }}/dns_records?type=A&name={{ record_name }}"
    method: get
    headers:
      Authorization: "{{ auth }}"
      Content-Type: application/json
    timeout: 20

  cloudflare_patch_dns_record:
    url: "https://api.cloudflare.com/client/v4/zones/{{ zone_id }}/dns_records/{{ record_id }}"
    method: patch
    headers:
      Authorization: "{{ auth }}"
      Content-Type: application/json
    payload: '{"type": "A", "name": "{{ record_name }}", "content": "{{ ip }}"}'
    timeout: 20

automation:
  - id: cloudflare_ddns_update
    alias: "Cloudflare DDNS: update A record"
    description: >-
      Patches the Cloudflare A record whenever the public IP changes and
      reports the result to Discord.
    variables:
      auth: !secret cloudflare_auth_header
      zone_id: !secret cloudflare_zone_id
      record_name: !secret cloudflare_record_name
      discord_channel: !secret discord_ddns_channel_id
    triggers:
      - trigger: state
        entity_id: sensor.public_ip
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        hours: /6
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.public_ip') | regex_match('^(\d{1,3}\.){3}\d{1,3}$') }}
    actions:
      - variables:
          new_ip: "{{ states('sensor.public_ip') }}"

      - action: rest_command.cloudflare_get_dns_record
        data:
          auth: "{{ auth }}"
          zone_id: "{{ zone_id }}"
          record_name: "{{ record_name }}"
        response_variable: lookup

      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ lookup.status != 200 or not lookup.content.success
                     or lookup.content.result | count == 0 }}
            sequence:
              - action: notify.home_assistant
                data:
                  target:
                    - "{{ discord_channel }}"
                  message: >-
                    :warning: **Cloudflare DDNS failed** - could not read the A record for
                    `{{ record_name }}` (HTTP {{ lookup.status }}).
                    {{ lookup.content.errors | default('Does the A record exist?') }}
              - stop: DNS record lookup failed

      - variables:
          record: "{{ lookup.content.result[0] }}"

      - condition: template
        value_template: "{{ record.content != new_ip }}"

      - action: rest_command.cloudflare_patch_dns_record
        data:
          auth: "{{ auth }}"
          zone_id: "{{ zone_id }}"
          record_id: "{{ record.id }}"
          record_name: "{{ record_name }}"
          ip: "{{ new_ip }}"
        response_variable: patch

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ patch.status == 200 and patch.content.success }}"
            sequence:
              - action: notify.home_assistant
                data:
                  target:
                    - "{{ discord_channel }}"
                  message: >-
                    :white_check_mark: **Cloudflare DDNS updated** - `{{ record_name }}`:
                    {{ record.content }} -> **{{ new_ip }}**
        default:
          - action: notify.home_assistant
            data:
              target:
                - "{{ discord_channel }}"
              message: >-
                :warning: **Cloudflare DDNS failed** - PATCH of `{{ record_name }}` to
                {{ new_ip }} returned HTTP {{ patch.status }}.
                {{ patch.content.errors | default('') }}
    mode: single
    max_exceeded: silent
